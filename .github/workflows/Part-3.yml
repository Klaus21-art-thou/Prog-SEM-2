name: MVC CI/CD Pipeline

on:
  push:
    branches: [ "main", "Part-2", "Part-3" ]
  pull_request:
    branches: [ "main", "Part-2", "Part-3" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up .NET 8 SDK environment
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restore NuGet dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Build the MVC project in Release mode
    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    # 5. Run automated tests (if any are present)
    - name: Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal || echo "No test projects found or tests skipped."

  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Log in to GitHub Container Registry (GHCR)
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Build and push the MVC Docker image to GitHub Packages with dynamic branch tags
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}-mvc:${{ github.ref_name }}
          ghcr.io/${{ github.repository }}-mvc:${{ github.sha }}
