name: RaceDay CI/CD Pipeline

on:
  push:
    branches: [ "Part-2", "main", "master" ]
  pull_request:
    branches: [ "Part-2", "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Discover solution and project files
      id: discover
      shell: bash
      run: |
        echo "Searching for RaceDayManagementAPI.csproj and .sln..."
        CSPROJ=$(find . -maxdepth 6 -name 'RaceDayManagementAPI.csproj' -print -quit || true)
        SOLN=$(find . -maxdepth 6 -name '*.sln' -print -quit || true)
        echo "Found CSPROJ=${CSPROJ}"
        echo "Found SOLN=${SOLN}"
        if [ -n "$CSPROJ" ]; then
          TARGET="$CSPROJ"
        elif [ -n "$SOLN" ]; then
          TARGET="$SOLN"
        else
          echo "No RaceDayManagementAPI.csproj or .sln found; dumping repo for debugging"
          ls -R
          exit 1
        fi
        # remove leading ./ if present
        TARGET="${TARGET#./}"
        echo "target=$TARGET" >> $GITHUB_OUTPUT

    - name: Show chosen target
      run: echo "Building: ${{ steps.discover.outputs.target }}"

    - name: Restore Dependencies
      run: dotnet restore "${{ steps.discover.outputs.target }}"

    - name: Build
      run: dotnet build "${{ steps.discover.outputs.target }}" --configuration Release --no-restore

    - name: Test
      run: dotnet test "${{ steps.discover.outputs.target }}" --configuration Release --no-build --verbosity normal
