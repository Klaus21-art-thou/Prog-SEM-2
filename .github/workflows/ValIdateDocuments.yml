# .github/workflows/ValIdateDocuments.yml
name: ValIdateDocuments

on:
  push:
    paths:
      - "Docs/API.md"
      - "Docs/ERD.pdf"
      - "Docs/RaceDay.sql"
      - ".github/workflows/ValIdateDocuments.yml"
  pull_request:
    paths:
      - "Docs/API.md"
      - "Docs/ERD.pdf"
      - "Docs/RaceDay.sql"
      - ".github/workflows/ValIdateDocuments.yml"

permissions:
  contents: read

jobs:
  build:
    name: Validate documentation artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "Docs/API.md"
            "Docs/ERD.pdf"
            "Docs/RaceDay.sql"
          )

          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing"
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required file is empty"
              exit 1
            fi
          done

      - name: Create Markdown Linter Config
        shell: bash
        run: |
          echo "MD013: false" > .markdownlint.yaml

      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            Docs/API.md

      - name: Validate PDF
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

          pdfinfo Docs/ERD.pdf >/tmp/erd-pdfinfo.txt

          pages="$(awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}' /tmp/erd-pdfinfo.txt)"

          if [[ -z "$pages" || "$pages" -lt 1 ]]; then
            echo "::error file=Docs/ERD.pdf::PDF has no pages"
            exit 1
          fi

          echo "Docs/ERD.pdf: valid PDF, $pages page(s)"

      - name: Validate SQL
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check --quiet sqlfluff

          # Create a local SQLFluff config to ignore style, capitalization, and line-length rules
          cat <<EOF > .sqlfluff
          [sqlfluff]
          dialect = tsql
          exclude_rules = CP02, LT05, LT01, AM04
          EOF

          sqlfluff lint Docs/RaceDay.sql
