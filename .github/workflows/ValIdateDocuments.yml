# This is a basic workflow to help you get started with Actions
name: ValIdateDocuments

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Core Project Files
        run: |
          MISSING_FILES=0
          
          if [ ! -f "API.md" ]; then
            echo "::error::Missing API documentation (API.md)"
            MISSING_FILES=$((MISSING_FILES + 1))
          fi

          if [ ! -f "RaceDay.sql" ]; then
            echo "::error::Missing SQL script (RaceDay.sql)"
            MISSING_FILES=$((MISSING_FILES + 1))
          fi

          if [ ! -f "ERD.pdf" ]; then
            echo "::warning::ERD diagram (ERD.pdf) not found in the root directory."
          fi

          if [ $MISSING_FILES -gt 0 ]; then
            echo "Validation failed: $MISSING_FILES required file(s) missing."
            exit 1
          else
            echo "All required core files are present."
          fi

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v12
        with:
          globs: "**/*.md"
