name: .NET Core CI/CD Pipeline

on:
push:
    branches: [ "main", "part 2" ]
  pull_request:
    branches: [ "main", "part 2" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup .NET SDK (matches .NET 8 / modern standard)
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restore NuGet dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Build the solution in Release mode
    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    # 5. Run xUnit Unit Tests with verbosity for output tracking
    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    # 6. Publish the Web API artifact for deployment
    - name: Publish Artifact
      run: dotnet publish -c Release -o ./publish-output

    # 7. Upload deployment artifact (accessible in GitHub Actions run view)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-artifact
        path: ./publish-output
